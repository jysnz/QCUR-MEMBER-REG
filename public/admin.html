<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCU Robotics Members</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.wrap{flex:1;width:100%;max-width:820px;margin:0 auto;padding:48px 24px}
h1{font:700 2.4rem var(--display);letter-spacing:-.035em;margin-bottom:24px}
h1 span{color:var(--muted);font-weight:500}
.grid{display:grid;gap:14px}
.empty{color:var(--muted)}
.card .thumbs{margin-top:12px}
.card .hc-retry{margin-top:10px}
.thumbs img{width:64px;height:64px}
.keyform{display:flex;gap:8px;max-width:420px;margin-bottom:20px}
.keyform[hidden]{display:none}
.keyform input{flex:1}
.pill{display:inline-block;margin-left:8px;padding:1px 10px;border-radius:99px;border:1px solid var(--border-2);font-size:.72rem;color:var(--muted);vertical-align:middle}
.pill.pending{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/" aria-label="QCU Robotics home">
      <img class="logo" src="logo-96.png" alt="" width="44" height="44">
      <span class="brand-text"><strong>QCU Robotics</strong><small>Members</small></span>
    </a>
    <a class="status" href="/">Registration page</a>
  </div>
</header>
<main class="wrap">
  <h1>Members <span id="count"></span></h1>
  <form class="keyform" id="keyForm" hidden>
    <input type="password" id="key" placeholder="Admin key" aria-label="Admin key" autocomplete="off">
    <button class="btn btn-primary btn-sm" type="submit">View</button>
  </form>
  <p class="error" id="err" role="alert"></p>
  <div class="grid" id="list"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const fmtDate = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
const withKey = (u) => { const k = sessionStorage.getItem("k"); return k && u.startsWith("/api/") ? u + "?key=" + encodeURIComponent(k) : u; };
const line = (parent, text) => { if (!text) return; const p = document.createElement("p"); p.textContent = text; parent.append(p); };

async function load(key) {
  $("#err").textContent = "";
  const r = await fetch("/api/members", { headers: key ? { "x-admin-key": key } : {} });
  if (r.status === 401) {
    $("#keyForm").hidden = false;
    if (key) $("#err").textContent = "Wrong key.";
    return;
  }
  if (!r.ok) { $("#err").textContent = "Could not load members."; return; }
  if (key) sessionStorage.setItem("k", key);
  $("#keyForm").hidden = true;
  const rows = await r.json();
  $("#count").textContent = `(${rows.length})`;
  const list = $("#list"); list.innerHTML = "";
  if (!rows.length) { list.innerHTML = '<p class="empty">No one has registered yet.</p>'; return; }
  for (const m of rows) {
    const urls = m.photoUrls || [];
    const card = document.createElement("article"); card.className = "card";
    const img = document.createElement("img"); img.width = img.height = 88; img.alt = m.firstName || "";
    img.loading = "lazy"; img.decoding = "async";
    // Small preview when there is one (saved at registration); fall back to the full photo for older entries.
    if (m.thumbUrl) { img.onerror = () => { img.onerror = null; if (urls[0]) img.src = withKey(urls[0]); }; img.src = m.thumbUrl; }
    else if (urls[0]) img.src = withKey(urls[0]);
    const body = document.createElement("div");
    const h = document.createElement("h3"); h.textContent = `${m.firstName} ${m.lastName}`;
    if (m.status) { const s = document.createElement("span"); s.className = "pill " + m.status; s.textContent = m.status; h.append(s); }
    body.append(h);
    line(body, [m.program || m.course, m.year, m.section].filter(Boolean).join(" · "));
    line(body, [m.studentId && "ID " + m.studentId, m.gender, m.email].filter(Boolean).join(" · "));
    if (m.birthday) line(body, "Born " + fmtDate(m.birthday));
    const tags = document.createElement("ul"); tags.className = "tags";
    [...(m.hobbies || []), ...(m.likes || [])].forEach((t) => { const li = document.createElement("li"); li.textContent = t; tags.append(li); });
    body.append(tags);
    line(body, m.about);
    if (urls.length > 1) {
      // The other photos only load when asked for, which keeps the page light with many members.
      const btn = document.createElement("button"); btn.type = "button"; btn.className = "hc-retry"; btn.textContent = `View all ${urls.length} photos`;
      const th = document.createElement("div"); th.className = "thumbs"; th.hidden = true;
      btn.addEventListener("click", () => {
        if (!th.childElementCount) urls.forEach((u) => { const t = new Image(); t.alt = ""; t.loading = "lazy"; t.src = withKey(u); th.append(t); });
        th.hidden = !th.hidden; btn.textContent = th.hidden ? `View all ${urls.length} photos` : "Hide photos";
      });
      body.append(btn, th);
    }
    card.append(img, body); list.append(card);
  }
}
$("#keyForm").addEventListener("submit", (e) => { e.preventDefault(); load($("#key").value); });
load(sessionStorage.getItem("k") || "");
</script>
</body>
</html>
